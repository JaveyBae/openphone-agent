plugins {
    id "com.android.application"
}

android {
    namespace "ai.openphone.agent"
    compileSdk 35

    defaultConfig {
        applicationId "ai.openphone.agent"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
